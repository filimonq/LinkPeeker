---
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GO_VERSION: "1.25"
  GO_LINTER_VERSION: "v2.10"
  PROXY: "gitlab.education.tbank.ru:443/backend-academy-go-2025/lecture-materials/dependency_proxy/containers"
  GOLANG_IMAGE: "${PROXY}/golang:${GO_VERSION}-alpine"
  GOLANGCI_IMAGE: "${PROXY}/golangci/golangci-lint:${GO_LINTER_VERSION}-alpine"
  DOCKER_IMAGE: "${PROXY}/docker:latest"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  paths:
    - .go/pkg/mod/
    - .cache/go-build/

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: ${GOLANGCI_IMAGE}
  script:
    - golangci-lint run -c .golangci.yml --timeout=5m
  rules:
    - when: always

test:
  stage: test
  image: ${GOLANG_IMAGE}
  script:
    - apk add --no-cache gcc musl-dev
    - go test -race -coverprofile=coverage.out $(go list ./... | grep -v integration)
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'
  rules:
    - when: always

integration_test:
  stage: test
  image: ${GOLANG_IMAGE}
  timeout: 30m
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  tags:
    - dind
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - apk add --no-cache gcc musl-dev
    - export DOCKER_BUILDKIT=1
  script:
    - go test -v -tags integration -timeout 20m ./internal/integration ./internal/bot/adapter/in/kafka
  rules:
    - when: always

build:
  stage: build
  image: ${GOLANG_IMAGE}
  script:
    - mkdir -p bin
    - for d in cmd/*; do
      name="$(basename "$d")";
      echo "Building $name";
      go build -o "bin/$name" "./cmd/$name";
      done
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: "$CI_COMMIT_BRANCH =~ /^(master|main)$/"
    - when: never
