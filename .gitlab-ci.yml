---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GO_VERSION: "1.25"
  GO_LINTER_VERSION: "v2.10"
  GOLANG_IMAGE: golang:${GO_VERSION}-alpine
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"

cache:
  paths:
    - .go/pkg/mod/

stages:
  - check
  - build

lint:
  stage: check
  image: golangci/golangci-lint:${GO_LINTER_VERSION}-alpine
  cache:
    key: lint-cache
    paths:
      - .cache/golangci-lint
  script:
    - golangci-lint run -c .golangci.yml --timeout=5m --fast
  rules:
    - when: always

unit_test:
  stage: check
  image: ${GOLANG_IMAGE}
  script:
    - apk add --no-cache gcc musl-dev
    - go test -race -coverprofile=coverage.out $(go list ./... | grep -v integration)
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'
  rules:
    - when: always

integration_test:
  stage: check
  image: ${GOLANG_IMAGE}
  timeout: 15m
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  tags:
    - dind
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - go test -v ./internal/integration/...
  rules:
    - when: always

build:
  stage: build
  image: ${GOLANG_IMAGE}
  needs:
    - job: lint
    - job: unit_test
  script:
    - mkdir -p bin
    - for d in cmd/*; do
      name="$(basename "$d")";
      echo "Building $name";
      go build -o "bin/$name" "./cmd/$name";
      done
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: "$CI_COMMIT_BRANCH =~ /^(master|main)$/"
    - when: never
