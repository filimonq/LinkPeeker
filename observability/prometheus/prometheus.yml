global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: scrapper
    metrics_path: /metrics
    static_configs:
      - targets: ["scrapper:8081"]

  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:8011"]

  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8012"]
